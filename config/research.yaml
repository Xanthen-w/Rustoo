# Research protocol: chronological data splits + walk-forward settings.
#
# Splits are half-open [start, end): a bar belongs to the split containing
# its UTC close time. They must never be shuffled — returns are serially
# dependent. `test` is the holdout: evaluate the final strategy on it once,
# never use it to choose anything (scripts refuse it without an explicit
# --use-holdout flag).

splits:
  train:
    start: "2024-09-26"
    end: "2026-01-01"
  validation:
    start: "2026-01-01"
    end: "2026-06-01"
  test:
    start: "2026-06-01"
    end: null   # through the end of available data
    # USED ONCE on 2026-09-27 for the final evaluation of the selected
    # strategy (docs/STRATEGY.md). It is no longer unseen data.

# Walk-forward optimisation inside a split: pick parameters on each rolling
# in-sample window, score them on the following out-of-sample window.
walk_forward:
  split: train
  resample: "1h"
  in_sample_days: 120
  out_of_sample_days: 30
  step_days: 30
  anchored: false          # true = in-sample window always starts at the split start
  # Selection metric per in-sample window. Not composite_score: its Calmar
  # term annualises short-window returns and explodes on one good month.
  objective: sortino_ratio
  cost_scenario: base

# Parameter grids per strategy (keys are the function's keyword arguments in
# src/strategy/signals.py::STRATEGIES; lookbacks are in bars of `resample`).
# `engine.rebalance_threshold` is searched alongside the strategy params.
grids:
  # Benchmark, with and without the drawdown overlay, on identical windows.
  buy_and_hold:
    params:
      symbol: ["BTC/USD"]
    engine:
      rebalance_threshold: [0.05]
      risk:
        - null
        - {caution: 0.05, defensive: 0.10, emergency: 0.20, cooldown_bars: 72}
        - {caution: 0.08, defensive: 0.15, emergency: 0.25, cooldown_bars: 168}
  # Risk-managed BTC/ETH core (Phases 10-13): per-asset trend filter with
  # hysteresis, inverse-vol sizing to a volatility target, drawdown overlay.
  trend_vol_target:
    params:
      assets: [["BTC/USD", "ETH/USD"], ["BTC/USD"]]
      trend_span: [72, 168, 336]
      band: [0.0, 0.02]
      target_vol: [0.3, 0.5]
      vol_lookback: [168]
    engine:
      rebalance_threshold: [0.05]
      risk:
        - null
        - {caution: 0.05, defensive: 0.10, emergency: 0.20, cooldown_bars: 72}
  trend_following:
    params:
      fast_span: [24, 48, 96]
      slow_span: [120, 240, 480]
    engine:
      rebalance_threshold: [0.0, 0.05, 0.10]
  cross_sectional_momentum:
    params:
      lookback: [72, 168, 336]
      top_k: [3, 5, 10]
    engine:
      rebalance_threshold: [0.0, 0.05, 0.10]
  single_asset_momentum:
    params:
      symbol: ["BTC/USD"]
      lookback: [72, 168, 336]
    engine:
      rebalance_threshold: [0.0]
  volatility_filtered_momentum:
    params:
      momentum_lookback: [72, 168, 336]
      vol_lookback: [168]
      vol_percentile_cutoff: [0.7, 0.9]
    engine:
      rebalance_threshold: [0.0, 0.05, 0.10]
  mean_reversion:
    params:
      lookback: [24, 72]
      z_entry: [1.5, 2.0, 2.5]
    engine:
      rebalance_threshold: [0.0, 0.05, 0.10]

# 14-day window analysis (scripts/window_analysis.py): the competition scores
# one 14-day run from cash, so candidates are compared on the distribution of
# outcomes over every historical 14-day window (step 1 day).
window_analysis:
  resample: "1h"
  window_days: 14
  step_days: 1
  warmup_days: 110          # longest trend span (100d) + slack, skipped at the data start
  min_trading_days: 8       # competition rule
  cost_scenario: base
  grids:
    buy_and_hold:           # first entry = benchmark for p_beats_benchmark
      params:
        symbol: ["BTC/USD"]
      engine:
        rebalance_threshold: [0.05]
    trend_vol_target:       # slow (daily-scale) trend on hourly bars: 960h = 40 days
      # Narrowed from a 48-point train sweep (2026-09-27): 20-100d spans all
      # sat in cash most of 2025 and traded on a median of 1-4 days per
      # window. min_exposure + a daily scheduled rebalance address the
      # competition's >= 8 trading-days rule.
      params:
        assets: [["BTC/USD", "ETH/USD"], ["BTC/USD", "ETH/USD", "SOL/USD"]]
        trend_span: [960, 1440]
        band: [0.03]
        target_vol: [0.5, 1.0]
        vol_lookback: [720]
        min_exposure: [0.0, 0.15, 0.3]
      engine:
        rebalance_threshold: [0.05]
        rebalance_hours_utc: [[], [0]]
