# Strategy/portfolio parameters. Nothing here should be hard-coded in
# src/strategy — everything tunable lives in this file so research can sweep
# it without touching code.

momentum:
  lookback_periods: [24, 96, 288]  # in bars, whatever the bar interval is
  ema_fast: 20
  ema_slow: 60

volatility:
  lookback_periods: 96
  target_annualized_vol: 0.20
  periods_per_year: 8760  # hourly bars default; override per data source

cross_sectional:
  top_k: 3

mean_reversion:
  lookback_periods: 12
  z_entry: 1.5

portfolio:
  max_asset_weight: 0.35
  max_gross_exposure: 1.0
  min_trade_threshold: 0.02   # do not trade if |target - current| below this
  cash_weight_floor: 0.0

# LIVE STRATEGY (selected 2026-09-27). Chosen on 14-day windows of the
# train split, confirmed once on validation (Jan-May 2026); the holdout is
# untouched. Validation: mean 14d return -1.3% vs BTC buy-and-hold -1.6%,
# 10th percentile -7.1% vs -14.0%, worst -11.0% vs -28.7%, >= 8 trading
# days in 100% of windows. See docs/STRATEGY.md.
trend_vol_target:
  assets: ["BTC/USD", "ETH/USD"]
  trend_span: 960      # hourly bars = 40 days
  band: 0.03           # hysteresis around the EMA
  vol_lookback: 720    # 30 days
  target_vol: 0.5      # annualized, split across assets
  min_exposure: 0.15   # share of vol-target size kept when out of trend

# Researcher's hypothesis for the live strategy (shown in reports as a
# hypothesis, separate from the evidence).
strategy_notes:
  hypothesis: >-
    Crypto majors trend over weeks; staying out of assets below their 40-day
    trend and sizing by volatility should cut the left tail (drawdowns and
    downside volatility, which the competition score penalizes) more than it
    costs in missed upside. Expected to fail in fast V-shaped reversals and
    in choppy markets around the trend line, and it cannot profit from
    falling prices.

execution_policy:
  bar: "1h"
  execution_price: open         # backtests: fill at the open of the bar after the signal (closest to the live bot)
  rebalance_threshold: 0.05     # skip trades smaller than 5% weight drift...
  # ...except exact rebalances at these UTC hours (every 6h). Chosen over
  # once a day on 2026-09-28 (scripts/rebalance_frequency.py): ~8 fills/day
  # instead of ~2 for about 0.03% of capital per 14 days, to clearly meet the
  # competition's "enough trades each day" requirement.
  rebalance_hours_utc: [0, 6, 12, 18]
  risk_overlay: false           # drawdown overlay hurt in walk-forward (whipsaw)

# Drawdown state machine (src/risk/drawdown.py): exposure multiplier per
# state; de-escalates one level after cooldown_bars, re-arming the peak.
risk:
  drawdown_caution: 0.05
  drawdown_defensive: 0.10
  drawdown_emergency: 0.20
  caution_exposure: 0.75
  defensive_exposure: 0.5
  emergency_exposure: 0.0
  cooldown_bars: 72
